services:
  - type: web
    name: hablai-api
    runtime: docker
    plan: free

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000